name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AlDar.slnx

      - name: Build solution
        run: dotnet build AlDar.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test AlDar.slnx --no-build --configuration Release